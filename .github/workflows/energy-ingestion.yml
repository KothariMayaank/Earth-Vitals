name: Ingest Ember electricity data

on:
  schedule:
    - cron: "23 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Download current Ember release
        run: curl --fail --location --retry 3 --output /tmp/ember-energy.csv https://files.ember-energy.org/public-downloads/yearly_full_release_long_format.csv
      - name: Ingest Ember electricity data
        run: python -m backend.pipeline.energy_ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ENERGY_DATA_CSV_PATH: /tmp/ember-energy.csv
