name: Ingest World Bank freshwater data

on:
  schedule:
    - cron: "37 7 10 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshwater-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Ingest World Bank freshwater indicators
        run: python -m backend.pipeline.freshwater_ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
