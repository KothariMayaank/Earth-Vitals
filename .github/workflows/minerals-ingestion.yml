name: Ingest mineral reserves

on:
  schedule:
    - cron: "41 6 15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minerals-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Ingest mineral reserves
        run: python -m backend.pipeline.minerals_ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MINERALS_DATA_CSV_PATH: backend/data/minerals_reserves.csv
