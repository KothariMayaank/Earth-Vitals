services:
  - type: web
    name: earth-vitals-api
    runtime: python
    plan: free
    buildCommand: pip install --requirement backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
